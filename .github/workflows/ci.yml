name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pydantic confluent-kafka email-validator pyyaml types-PyYAML scipy redis pyspark feast pandas pyarrow great_expectations==0.18.19
        # Week 4-5 additions
        pip install fastapi uvicorn httpx prometheus-client mlflow xgboost scikit-learn tensorflow locust

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy simulator pipeline tests api models --install-types --non-interactive

    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python -m pytest tests/unit/ tests/integration/ -v --ignore=tests/integration/test_data_quality.py