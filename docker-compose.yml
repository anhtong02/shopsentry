services:

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-one
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "8081:8081"
      - "9644:9644"

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:29092"]
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: shopsentry-mlflow
    ports:
    - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns/artifacts
      --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000"
    volumes:
    - mlflow-data:/mlruns


  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: shopsentry-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_VERSION: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONNECTION_STRING: redis:6379
    depends_on:
      - mlflow
      - redis
    restart: on-failure

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: shopsentry-simulator
    environment:
      KAFKA_BROKER: redpanda:29092
    depends_on:
      - redpanda
    restart: on-failure

  spark-job:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: shopsentry-spark-job
    environment:
      KAFKA_BROKER: redpanda:29092
      REDIS_CONNECTION_STRING: redis:6379
    volumes:
      - ./feature_repo/feature_repo/data:/app/feature_repo/feature_repo/data
    depends_on:
      - redpanda
      - redis
    restart: on-failure
  scorer:
    build:
      context: .
      dockerfile: scorer/Dockerfile
    container_name: shopsentry-scorer
    environment:
      API_URL: http://api:8000
    volumes:
      - ./feature_repo/feature_repo/data:/app/feature_repo/feature_repo/data
    depends_on:
      - api
    restart: on-failure

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: shopsentry-monitor
    ports:
      - "8001:8001"
    volumes:
      - ./feature_repo/feature_repo/data:/app/feature_repo/feature_repo/data
    restart: on-failure
  prometheus:
    image: prom/prometheus:latest
    container_name: shopsentry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - monitor
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: shopsentry-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shopsentry.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  mlflow-data:
  prometheus-data:
  grafana-data: